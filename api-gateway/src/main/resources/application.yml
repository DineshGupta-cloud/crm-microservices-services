server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**
        - id: branch-service
          uri: lb://branch-service
          predicates:
            - Path=/api/v1/branches/**
        - id: department-service
          uri: lb://department-service
          predicates:
            - Path=/api/v1/departments/**
        - id: designation-service
          uri: lb://designation-service
          predicates:
            - Path=/api/v1/designations/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/api/v1/employees/**
        - id: lead-service
          uri: lb://lead-service
          predicates:
            - Path=/api/v1/leads/**
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**
        - id: vendor-service
          uri: lb://vendor-service
          predicates:
            - Path=/api/v1/vendors/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/api/v1/tasks/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/v1/audits/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
