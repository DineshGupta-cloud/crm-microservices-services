server:
  port: 8091
spring:
  application:
    name: task-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/task_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
