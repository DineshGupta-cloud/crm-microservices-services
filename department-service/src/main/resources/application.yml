server:
  port: 8083
spring:
  application:
    name: department-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/crm_department?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}